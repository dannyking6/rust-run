<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b120d">
<title>Cargo Rush</title>
<!-- inline icon: no /favicon.ico request, so no 404 in the console on any portal -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23c8743a'/%3E%3Ccircle cx='5' cy='12' r='2.5' fill='%232a1a12'/%3E%3Ccircle cx='11' cy='12' r='2.5' fill='%232a1a12'/%3E%3C/svg%3E">
<script src="./game-driver.js"></script>
<style>html,body{overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;background:#1b120d;height:100%;margin:0;overflow:hidden}#game{position:fixed;top:0;bottom:0;left:0;right:0}#game canvas{display:block}#boot{color:#ffd9a0;z-index:5;background:radial-gradient(at 50% 60%,#5a3220 0%,#1b120d 70%);flex-direction:column;justify-content:center;align-items:center;gap:18px;font:700 20px/1.2 system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;transition:opacity .35s;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#boot.hide{opacity:0;pointer-events:none}#boot .logo{letter-spacing:2px;color:#ffb347;text-shadow:0 4px #3a1d0e;font-size:44px}#boot .bar{background:#3a2418;border:3px solid #2a1a12;border-radius:10px;width:min(60vw,360px);height:14px;overflow:hidden}#boot .fill{background:linear-gradient(90deg,#ff8a2a,#ffd24a);width:4%;height:100%;transition:width .2s}#rotate{z-index:20;color:#ffd9a0;text-align:center;background:#1b120d;flex-direction:column;justify-content:center;align-items:center;gap:16px;padding:24px;font:700 22px/1.3 system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;display:none;position:fixed;top:0;bottom:0;left:0;right:0}#rotate .phone{border:5px solid #ffb347;border-radius:9px;width:46px;height:78px;animation:1.6s ease-in-out infinite rot}@keyframes rot{0%,20%{transform:rotate(0)}60%,to{transform:rotate(-90deg)}}@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}#adblock{z-index:30;background:#0a06048c;display:none;position:fixed;top:0;bottom:0;left:0;right:0}</style>
  <script type="module" crossorigin src="./assets/index-DU1c0Iic.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Cqxma4Yj.css">
</head>
<body>
<div id="game"></div>
<div id="boot"><div class="logo" aria-hidden="true"></div><div class="bar"><div class="fill" id="bootfill"></div></div></div>
<div id="rotate"><div class="phone"></div><div id="rotatetxt">Rotate your device</div></div>
<div id="adblock"></div>
<script>
  (function () {
    var l = (navigator.language || 'en').slice(0, 2).toLowerCase();
    if (l === 'ru' || l === 'uk' || l === 'be' || l === 'kk') {
      document.getElementById('rotatetxt').textContent = 'Поверните устройство';
      document.querySelector('#boot .logo').textContent = 'CARGO RUSH';
    }
    window.__bootProgress = function (p) {
      var f = document.getElementById('bootfill'); if (f) f.style.width = Math.round(4 + p * 96) + '%';
    };
  })();
</script>
</body>
</html>
